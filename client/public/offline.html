<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d10" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>You're offline — MYDROP</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:#0b0d10;color:#f5f5f7;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#20232a 0,transparent 48%),#0b0d10}.offline{width:min(100%,440px);padding:36px 28px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(26,28,32,.72);box-shadow:0 24px 70px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.brand{width:150px;height:auto;margin:0 auto 27px;display:block}.symbol{width:50px;height:50px;margin:0 auto 19px;border:1px solid rgba(255,255,255,.12);border-radius:15px;display:grid;place-items:center;color:#ff696d;background:#211719}.symbol svg{width:23px;height:23px}.eyebrow{margin:0 0 9px;color:#e7888a;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.04em}p{margin:12px 0 23px;color:#a9adb4;font-size:14px;line-height:1.65}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}button,a{min-height:44px;padding:0 17px;border:1px solid rgba(255,255,255,.18);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:#f5f5f7;background:rgba(255,255,255,.06);font:inherit;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer}button:hover,a:hover{background:rgba(255,255,255,.12)}.primary{border-color:#fff;background:#f5f5f7;color:#18191b}.primary:hover{background:#fff}.hint{margin:21px 0 0;color:#737982;font-size:10px}@media(max-width:420px){.offline{padding:30px 20px}h1{font-size:25px}}
  </style>
</head>
<body>
  <main class="offline">
    <img class="brand" src="/mydrop-logo.svg" alt="MYDROP" />
    <div class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8.5h6l2 2h8v8.2a1.3 1.3 0 0 1-1.3 1.3H5.3A1.3 1.3 0 0 1 4 18.7V8.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7 4.5h10M12 3v7m-2.5-2.5L12 10l2.5-2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <p class="eyebrow">Connection paused</p>
    <h1>You're offline.</h1>
    <p>Reconnect to the internet to create a drop, join a transfer, or continue sharing. Your files are not stored by MYDROP.</p>
    <div class="actions"><button class="primary" onclick="window.location.reload()">Try again</button><button onclick="history.back()">Go back</button></div>
    <p class="hint">Your sharing code may expire while you’re away.</p>
  </main>
</body>
</html>
